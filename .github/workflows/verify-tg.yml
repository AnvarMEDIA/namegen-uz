name: Verify TG (one-shot, autonomous self-test)

# Triggers only when this file or api/check-tg/** changes. Runner has
# unrestricted internet; calls our handler() against real t.me and
# commits the verdict back so the sandbox can read it via raw.
# Will be deleted after the verdict confirms restored behaviour.

on:
  push:
    branches: [claude/enhance-from-current]
    paths:
      - '.github/workflows/verify-tg.yml'
      - 'api/check-tg/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run check-tg handler against real t.me
        run: |
          cat > .verify-runner.mjs << 'EOF'
          import handler from './api/check-tg/[name].js';
          import { writeFileSync } from 'node:fs';

          const cases = [
            { name: 'durov',                       expected: 'taken' },
            { name: 'telegram',                    expected: 'taken' },
            { name: 'zzzqqqxxxnonexistent7382aaa', expected: 'free'  },
          ];
          const results = [];
          for (const c of cases) {
            const cap = { status: 0, body: null };
            const res = {
              status(s) { cap.status = s; return res; },
              json(b) { cap.body = b; return res; },
              setHeader() { return res; },
              end() { return res; },
            };
            const t0 = Date.now();
            try {
              await handler({ method: 'GET', query: { name: c.name } }, res);
            } catch (e) {
              cap.body = { error: e.message };
            }
            const elapsed_ms = Date.now() - t0;
            const got = cap.body && cap.body.status;
            results.push({ name: c.name, expected: c.expected, got, pass: got === c.expected, body: cap.body, elapsed_ms });
          }
          const summary = {
            timestamp: new Date().toISOString(),
            commit: process.env.GITHUB_SHA,
            all_pass: results.every((r) => r.pass),
            results,
          };
          writeFileSync('.verify/tg-verdict.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          EOF
          mkdir -p .verify
          node .verify-runner.mjs || echo "RUNNER EXIT $?"
          rm -f .verify-runner.mjs

      - name: Dump first 6KB of t.me HTML for marker discovery
        run: |
          cat > .dump-runner.mjs << 'EOF'
          import { writeFileSync } from 'node:fs';
          const names = ['durov', 'telegram', 'zzzqqqxxxnonexistent7382aaa'];
          const out = {};
          for (const u of names) {
            const r = await fetch('https://t.me/' + u, {
              headers: {
                'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                'Accept': 'text/html',
              },
              redirect: 'follow',
            });
            const html = await r.text();
            const headers = {};
            for (const [k, v] of r.headers.entries()) headers[k] = v;
            out[u] = {
              status: r.status,
              redirected: r.redirected,
              final_url: r.url,
              html_length: html.length,
              headers,
              tgme_page_title_found: html.includes('tgme_page_title'),
              tgme_page_description_found: html.includes('tgme_page_description'),
              tgme_page_action_found: html.includes('tgme_page_action'),
              tgme_action_button_label_found: html.includes('tgme_action_button_label'),
              tgme_page_photo_image_found: html.includes('tgme_page_photo_image'),
              tg_resolve_link_found: html.includes('tg://resolve?domain=' + u),
              og_title_found: html.includes('<meta property="og:title"'),
              og_image_found: html.includes('<meta property="og:image"'),
              og_description_found: html.includes('<meta property="og:description"'),
              tgme_404_found: html.includes('tgme_404'),
              telegram_logo_found: html.includes('telegram_logo'),
              joinchat_found: html.includes('joinchat'),
              html_first_6kb: html.slice(0, 6144),
            };
          }
          writeFileSync('.verify/tg-html-dump.json', JSON.stringify(out, null, 2));
          EOF
          node .dump-runner.mjs || echo "DUMP EXIT $?"
          rm -f .dump-runner.mjs

      - name: Commit verdict back
        run: |
          git config user.name "verify-bot"
          git config user.email "verify@bot.local"
          git add .verify/
          if git diff --cached --quiet; then
            echo "no verdict changes — skipping commit"
            exit 0
          fi
          git commit -m "verify: tg handler verdict [skip ci]"
          git push origin claude/enhance-from-current
