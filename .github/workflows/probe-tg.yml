name: Probe TG (diagnostic + verify, autonomous)

# Push the workflow file or any change under api/check-tg/ → runner
# fetches real t.me HTML for three reference handles AND runs our
# current check-tg handler against the same handles, commits both
# back to .probe/ for analysis from the sandbox.
#
# [skip ci] in the bot commit prevents recursive triggers.

on:
  push:
    branches: [claude/enhance-from-current]
    paths:
      - '.github/workflows/probe-tg.yml'
      - 'api/check-tg/**'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch raw t.me HTML for 3 reference handles
        run: |
          set -u
          mkdir -p .probe
          for u in durov telegram zzzqqqxxxnonexistent7382aaa; do
            echo "=== fetching t.me/$u ==="
            curl -sSL -i --max-time 15 \
              -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: en-US,en;q=0.9" \
              "https://t.me/$u" \
              > ".probe/raw-$u.txt" 2>&1 || echo "curl exit $?"
            echo "  $(wc -c < ".probe/raw-$u.txt") bytes"
          done

      - name: Run check-tg handler against real t.me
        run: |
          cat > .probe-runner.mjs << 'EOF'
          import handler from './api/check-tg/[name].js';
          import { writeFileSync } from 'node:fs';

          const names = ['durov', 'telegram', 'zzzqqqxxxnonexistent7382aaa'];
          const expected = { durov: 'taken', telegram: 'taken', zzzqqqxxxnonexistent7382aaa: 'free' };
          const results = {};

          for (const name of names) {
            const cap = { status: 0, body: null, headers: {} };
            const res = {
              status(c) { cap.status = c; return res; },
              json(b) { cap.body = b; return res; },
              setHeader(k, v) { cap.headers[k] = v; return res; },
              end() { return res; },
            };
            const t0 = Date.now();
            try {
              await handler({ method: 'GET', query: { name } }, res);
              results[name] = {
                http_status: cap.status,
                body: cap.body,
                expected: expected[name],
                pass: cap.body && cap.body.status === expected[name],
                elapsed_ms: Date.now() - t0,
              };
            } catch (e) {
              results[name] = { error: e.message, expected: expected[name], pass: false, elapsed_ms: Date.now() - t0 };
            }
          }

          const summary = {
            timestamp: new Date().toISOString(),
            commit: process.env.GITHUB_SHA,
            results,
            all_pass: Object.values(results).every((r) => r.pass),
          };
          writeFileSync('.probe/verdicts.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          EOF
          node .probe-runner.mjs || echo "RUNNER EXIT $?"
          rm -f .probe-runner.mjs

      - name: Marker presence quick-scan
        run: |
          cat > .probe-scan.mjs << 'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          const STATIC = [
            'tgme_action_button_label', 'tgme_page_action', 'tgme_page_photo_image',
            'tgme_widget_message', 'tgme_404', 'tgme_no_result', 'no_result_found',
            'tgme_page_title', 'tgme_page_description', 'tgme_header_link',
            'tgme_page_photo', 'tgme_page_extra', 'og:title', 'og:image',
            'og:description', 'tgme_main_username', 'tgme_username',
            'class="tgme_page', 'tgme_page_wrap', 'tgme_background',
            'data-source-id', 'preview_telegram_org', 'channel-info',
          ];
          const names = ['durov', 'telegram', 'zzzqqqxxxnonexistent7382aaa'];
          const out = {};
          for (const u of names) {
            const txt = readFileSync(`.probe/raw-${u}.txt`, 'utf8');
            // Skip HTTP status + headers (everything before first blank line)
            const blank = txt.indexOf('\r\n\r\n');
            const html = blank >= 0 ? txt.slice(blank + 4) : txt;
            const headerBlock = blank >= 0 ? txt.slice(0, blank) : '';
            const httpLine = txt.split('\n').find((l) => l.startsWith('HTTP/')) ?? '?';
            const finalRedirectLines = txt.split('\n').filter((l) => l.toLowerCase().startsWith('location:'));
            const markers = {};
            for (const m of STATIC) markers[m] = html.includes(m);
            markers[`tg://resolve?domain=${u}`] = html.includes(`tg://resolve?domain=${u}`);
            out[u] = {
              http_lines_seen: txt.split('\n').filter((l) => l.startsWith('HTTP/')),
              location_headers: finalRedirectLines,
              html_length: html.length,
              markers,
              html_first_3kb: html.slice(0, 3072),
              html_last_2kb: html.length > 5120 ? html.slice(-2048) : '<<small body — same as first chunk>>',
            };
          }
          writeFileSync('.probe/markers-scan.json', JSON.stringify(out, null, 2));
          console.log('marker scan written');
          EOF
          node .probe-scan.mjs || echo "SCAN EXIT $?"
          rm -f .probe-scan.mjs

      - name: Commit probe artefacts
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@bot.local"
          git add .probe/
          if git diff --cached --quiet; then
            echo "no probe changes — nothing to commit"
            exit 0
          fi
          git commit -m "probe: tg fetch + verdicts + marker scan [skip ci]"
          git push origin claude/enhance-from-current
